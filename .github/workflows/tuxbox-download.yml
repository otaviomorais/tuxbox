name: Preparar download do TuxBox Dev
on:
  push:
    branches: [codex/download-tuxbox-dev]
    paths: ['downloads/.parts/**']
permissions:
  contents: write
jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Montar e verificar APK
        shell: bash
        run: |
          set -euo pipefail
          cat downloads/.parts/tuxbox.000 downloads/.parts/tuxbox.001 downloads/.parts/tuxbox.002 > downloads/tuxbox-1.1.0-dev.apk
          cd downloads
          sha256sum -c SHA256SUMS
      - name: Disponibilizar APK na branch de downloads
        shell: bash
        run: |
          set -euo pipefail
          git rm downloads/.parts/tuxbox.000 downloads/.parts/tuxbox.001 downloads/.parts/tuxbox.002
          git add downloads/tuxbox-1.1.0-dev.apk
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Disponibiliza APK verificado do TuxBox Dev'
          git push origin HEAD:refs/heads/codex/download-tuxbox-dev
