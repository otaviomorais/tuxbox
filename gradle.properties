# TuxBox — config de build.
# Ajustado para o CELULAR (este projeto compila no próprio aparelho): builds
# leves, sem daemon persistente e com pouca RAM.
#
# v3.22 — o build deixava um daemon do Gradle vivo com 1 GB de RAM depois de
# terminar, num aparelho que já roda o app + container. Daemon desligado: cada
# build sobe, compila e sai.
org.gradle.daemon=false
org.gradle.jvmargs=-Xmx900m -XX:MaxMetaspaceSize=320m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# o aapt2 do SDK local (build offline sem depender do Maven)
android.aapt2FromMavenOverride=/opt/android-sdk/build-tools/34.0.0/aapt2
